worker_processes 1;
pid /data/data/com.termux/files/usr/var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    absolute_redirect off;

    server {
        listen 8080;
        server_name osachadinhosdashopee.com.br www.osachadinhosdashopee.com.br localhost;

        root /data/data/com.termux/files/home/achadinhos-codigo-limpo/frontend;
        index recomende.html index.html;

        # 🚀 A REGRA EXPLÍCITA: Transforma /admin em /admin.html
        rewrite ^/admin/?$ /admin.html last;

        # Redirecionamentos 301
        rewrite ^/post\.html$ /produto.html permanent;
        rewrite ^/ofertas/.*-([0-9]+)\.html$ /produto.html?id=$1 permanent;

        # Bloqueio de hackers
        location ~* /(\.|%2e)(env|aws|git|ansible|azure|DS_Store|svn|hg|bzr) {
            deny all;
            return 403;
        }

        # Sitemaps
        location ~ ^/sitemap.*\.xml$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rota principal
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
        
        # API
        location /api/ {
            proxy_pass http://127.0.0.1:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
