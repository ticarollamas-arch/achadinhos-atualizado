    <script>
        async function carregarProdutos() {
            try {
                const response = await fetch('/api/catalogo');
                const data = await response.json();
                const catalogo = document.getElementById('catalogo');
                catalogo.innerHTML = '';
                data.forEach(produto => {
                    const card = document.createElement('div');
                    card.className = 'produto-card';
                    card.innerHTML = `
                        <a href="/produto.html?id=${produto.id}" style="text-decoration: none; color: inherit;">
                            <img src="${produto.imagem}" loading="lazy">
                            <h2>${produto.titulo}</h2>
                            <div class="preco">R$ ${produto.preco.toFixed(2).replace('.', ',')}</div>
                        </a>
                    `;
                    catalogo.appendChild(card);
                });
            } catch (err) {
                document.getElementById('catalogo').innerHTML = '<p>Erro ao carregar ofertas.</p>';
            }
        }
        window.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
