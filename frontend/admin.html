<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Achadinhos da Shopee</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --text: #c9d1d9;
            --accent: #EE4D2D; --green: #238636; --border: #30363d;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .header h1 { margin: 0; font-size: 22px; color: #fff; }
        .status-dot { width: 12px; height: 12px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 10px var(--green); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .card-title { font-size: 12px; color: #8b949e; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
        .card-value { font-size: 36px; font-weight: 900; color: var(--accent); margin: 0; }
        .card-sub { font-size: 14px; color: #8b949e; margin-top: 5px; }
        .footer { text-align: center; font-size: 12px; color: #8b949e; margin-top: 20px; }
    </style>

    <!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-8190600021817615">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8190600021817615" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Centro de Comando</h1>
            <div><span class="status-dot"></span>Online</div>
        </div>
        
        <div class="card">
            <div class="card-title">Total de Produtos no Banco</div>
            <h2 class="card-value" id="total-produtos">Carregando...</h2>
            <div class="card-sub">Registros ativos no SQLite</div>
        </div>

        <div class="card">
            <div class="card-title">Status da API</div>
            <h2 class="card-value" id="status-api" style="font-size: 24px;">Verificando...</h2>
            <div class="card-sub">Latência: <span id="latencia">0</span> ms</div>
        </div>

        <div class="footer">Atualização automática a cada 30 segundos</div>
    </div>

    <script>
        async function fetchStats() {
            const start = Date.now();
            try {
                const res = await fetch('/api/admin/stats');
                if (!res.ok) throw new Error('Erro na API');
                const data = await res.json();
                
                document.getElementById('total-produtos').innerText = data.total.toLocaleString('pt-BR');
                document.getElementById('status-api').innerText = '🟢 Operacional';
                document.getElementById('status-api').style.color = '#238636';
                document.getElementById('latencia').innerText = Date.now() - start;
            } catch (e) {
                document.getElementById('status-api').innerText = '🔴 Offline';
                document.getElementById('status-api').style.color = '#da3633';
            }
        }
        setInterval(fetchStats, 30000);
        fetchStats();
    </script>
</body>
</html>
